<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Respeto que nos une — Tomás</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#dff4ff;font-family:Arial,sans-serif;color:#153d31;touch-action:none}
.wrap{max-width:900px;margin:auto;padding:8px}.head{background:#076442;color:white;border-radius:22px;padding:10px;text-align:center}
.head h1{margin:0;font-size:clamp(24px,5vw,40px)}.stats{display:flex;gap:10px;justify-content:center;margin-top:7px}.pill{background:#fff;color:#164936;border-radius:22px;padding:6px 15px;font-weight:bold}
.progress{display:flex;gap:5px;overflow-x:auto;margin:8px 0}.p{min-width:120px;flex:1;background:#fff;border-radius:11px;padding:7px;text-align:center;font-size:12px;font-weight:bold}.p.on{outline:3px solid #ffd238}.p.done{background:#d9f6df}
.stage{position:relative;height:min(67vh,620px);min-height:440px;background:#102536;border:7px solid white;border-radius:27px;overflow:hidden;box-shadow:0 5px 15px #0003}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.shade{position:absolute;inset:0;background:linear-gradient(transparent 70%,#0005)}
#hero{position:absolute;width:105px;height:auto;left:12%;top:68%;transform:translate(-50%,-65%);z-index:6;filter:drop-shadow(0 7px 5px #0007);transition:left .08s linear,top .08s linear}
.target{position:absolute;left:74%;top:45%;width:100px;height:48px;transform:translate(-50%,-50%);border:7px solid #ffd42e;border-radius:50%;box-shadow:0 0 30px #ffd42e;background:#ffd42e33;z-index:4}
.lock{position:absolute;right:3%;top:3%;background:#102536dd;color:white;border-radius:15px;padding:9px 13px;z-index:7;font-weight:bold}
.hint{position:absolute;left:3%;right:3%;bottom:2%;z-index:8;background:#fffffff2;padding:10px;border-radius:15px;text-align:center;font-weight:bold;font-size:17px}
.ctrl{display:grid;grid-template-columns:68px 68px 68px;grid-template-rows:55px 55px;gap:6px;justify-content:center;margin:9px}.b{border:0;background:#fff;color:#08704a;border-radius:15px;font-size:27px;font-weight:bold;box-shadow:0 3px 8px #0002}.u{grid-column:2}.l{grid-column:1}.d{grid-column:2}.r{grid-column:3}
.modal{display:none;position:fixed;inset:0;background:#000a;z-index:30;align-items:center;justify-content:center;padding:15px}.card{background:white;border-radius:22px;padding:20px;width:min(620px,100%);max-height:90vh;overflow:auto}.card h2{color:#08704a;margin-top:0}.choice{width:100%;text-align:left;padding:13px;margin:5px 0;border-radius:13px;border:2px solid #b7d8c9;background:#f8fffb;font-size:16px}.good{background:#d9f6df!important;border-color:#219653!important}.bad{background:#ffe1e1!important;border-color:#d54b4b!important}.next{display:none;width:100%;border:0;border-radius:13px;padding:13px;background:#159447;color:white;font-weight:bold;font-size:18px;margin-top:10px}.foot{text-align:center;padding:10px;font-size:12px}
</style></head><body><div class="wrap">
<div class="head"><h1>🎮 RESPETO QUE NOS UNE</h1><div>Tomás y las misiones del buen trato</div><div class="stats"><span class="pill">⭐ <b id="score">0</b></span><span class="pill">🏅 <b id="medals">0</b>/5</span></div></div>
<div id="progress" class="progress"></div>
<div class="stage" id="stage"><img id="bg" class="bg"><div class="shade"></div><div id="target" class="target"></div><img id="hero" src="tomas.png" alt="Tomás"><div id="lock" class="lock">🔒 Pregunta bloqueada</div><div id="hint" class="hint">Mueve a Tomás hasta el círculo amarillo.</div></div>
<div class="ctrl"><button class="b u" data-d="u">▲</button><button class="b l" data-d="l">◀</button><button class="b d" data-d="d">▼</button><button class="b r" data-d="r">▶</button></div>
<div class="foot">3ª Comisaría Algarrobo · Emergencias 133 · 35-2535096 · Instagram: 3ra.comisaria_algarrobo</div></div>
<div id="modal" class="modal"><div class="card"><h2 id="title"></h2><p id="question"></p><div id="choices"></div><p id="fb"></p><button id="next" class="next">Continuar ▶</button></div></div>
<script>
const levels=[
["1. COLEGIO · INCLUSIÓN","01_colegio.png","Ves a un compañero nuevo que está solo. ¿Qué acción demuestra inclusión?",["Ignorarlo para que se acostumbre.","Invitarlo a participar y conocer sus intereses.","Reírse porque todavía no conoce a nadie."],1,"Invitarlo a participar promueve la inclusión, la empatía y el respeto."],
["2. RECREO · TESTIGO ACTIVO","02_recreo.png","Ves que molestan repetidamente a un compañero. ¿Qué deberías hacer?",["Grabarlo y compartirlo.","Apoyarlo y avisar a un adulto de confianza sin ponerte en riesgo.","No hacer nada porque no es contigo."],1,"Un testigo activo apoya sin ponerse en riesgo y busca ayuda de un adulto responsable."],
["3. LÍDER · COMUNIDAD","03_lider.png","En un lugar público ves a una persona que necesita ayuda. ¿Qué acción refleja buen trato?",["Ofrecer ayuda respetuosamente.","Burlarse con los amigos.","Molestarla para grabar un video."],0,"El respeto también se practica en la comunidad: ayudar de manera respetuosa hace la diferencia."],
["4. MUNDO DIGITAL · USO RESPONSABLE","04_digital.png","Recibes por WhatsApp una imagen humillante de un compañero. ¿Qué haces?",["La reenvío.","No la comparto, conservo evidencia y pido ayuda a un adulto de confianza.","Le agrego comentarios."],1,"No compartir contenido humillante ayuda a detener el daño."],
["5. COMISARÍA · RED DE APOYO","05_comisaria.png","Si una situación te preocupa o te hace sentir inseguro, ¿qué es importante hacer?",["Guardarlo siempre en secreto.","Buscar apoyo de un adulto de confianza y usar los canales adecuados.","Enfrentar a todos por tu cuenta."],1,"Pedir ayuda es importante. El 133 se utiliza para emergencias o riesgo inmediato."]
];
let lv=0,x=12,y=68,score=0,medals=0,opened=false;
const hero=document.getElementById("hero"),modal=document.getElementById("modal");
function prog(){let p=document.getElementById("progress");p.innerHTML="";levels.forEach((a,i)=>{let e=document.createElement("div");e.className="p "+(i==lv?"on ":"")+(i<lv?"done":"");e.textContent=(i<lv?"✓ ":"🔒 ")+a[0];p.appendChild(e)})}
function load(){document.getElementById("bg").src=levels[lv][1];x=12;y=68;opened=false;hero.style.left=x+"%";hero.style.top=y+"%";document.getElementById("lock").textContent="🔒 Pregunta bloqueada";document.getElementById("hint").textContent="Mueve a Tomás hasta el círculo amarillo.";prog()}
function move(dx,dy){if(opened)return;x=Math.max(6,Math.min(92,x+dx));y=Math.max(20,Math.min(84,y+dy));hero.style.left=x+"%";hero.style.top=y+"%";if(Math.hypot(x-74,y-45)<10){opened=true;document.getElementById("lock").textContent="🔓 Pregunta habilitada";document.getElementById("hint").textContent="¡Llegaste! Responde la pregunta.";setTimeout(openQ,300)}}
function openQ(){let L=levels[lv];document.getElementById("title").textContent=L[0];document.getElementById("question").textContent=L[2];let c=document.getElementById("choices");c.innerHTML="";document.getElementById("fb").textContent="";document.getElementById("next").style.display="none";L[3].forEach((a,i)=>{let b=document.createElement("button");b.className="choice";b.textContent=String.fromCharCode(65+i)+". "+a;b.onclick=()=>ans(i,b);c.appendChild(b)});modal.style.display="flex"}
function ans(i,b){let L=levels[lv],bs=[...document.querySelectorAll(".choice")];bs.forEach(z=>z.disabled=true);if(i==L[4]){b.classList.add("good");score+=10;medals++;document.getElementById("fb").innerHTML="⭐ <b>¡Muy bien!</b> "+L[5]+" +10 puntos."}else{b.classList.add("bad");bs[L[4]].classList.add("good");document.getElementById("fb").textContent="💡 "+L[5]}document.getElementById("score").textContent=score;document.getElementById("medals").textContent=medals;document.getElementById("next").style.display="block"}
document.getElementById("next").onclick=()=>{modal.style.display="none";lv++;if(lv>=levels.length){document.body.innerHTML=`<div style="max-width:700px;margin:50px auto;text-align:center;font-family:Arial;padding:25px"><h1>🏆 GUARDIÁN DEL BUEN TRATO</h1><h2>¡Tomás completó las cinco misiones!</h2><p style="font-size:22px">⭐ ${score} puntos · 🏅 ${medals}/5 medallas</p><button onclick="location.reload()" style="padding:15px 28px;background:#159447;color:white;border:0;border-radius:14px;font-size:18px">Jugar nuevamente</button></div>`}else load()}
document.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{let d=b.dataset.d;move(d=="l"?-5:d=="r"?5:0,d=="u"?-5:d=="d"?5:0)});
document.addEventListener("keydown",e=>{if(modal.style.display=="flex")return;if(e.key=="ArrowLeft")move(-4,0);if(e.key=="ArrowRight")move(4,0);if(e.key=="ArrowUp")move(0,-4);if(e.key=="ArrowDown")move(0,4)});
let sx,sy;document.getElementById("stage").addEventListener("touchstart",e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});document.getElementById("stage").addEventListener("touchend",e=>{let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>Math.abs(dy))move(dx>0?6:-6,0);else move(0,dy>0?6:-6)},{passive:true});load();
</script></body></html>
