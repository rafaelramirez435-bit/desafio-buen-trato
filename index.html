<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Respeto que nos une</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#dff4ff;font-family:Arial,sans-serif;color:#123c34}.app{max-width:980px;margin:auto;padding:8px}.top{background:#075d42;color:#fff;border-radius:22px;padding:10px 15px;display:flex;align-items:center;justify-content:space-between;gap:8px}.brand{font-weight:900;font-size:clamp(22px,4vw,38px)}.level{background:#fff;color:#075d42;border-radius:20px;padding:8px 15px;font-weight:900}.stats{display:flex;gap:5px}.stat{background:#fff;color:#123c34;border-radius:20px;padding:7px 12px;font-weight:bold}
.stage{position:relative;margin-top:8px;height:min(68vh,650px);min-height:430px;border:7px solid #fff;border-radius:25px;overflow:hidden;background:#102536;box-shadow:0 5px 15px #0003}.scene{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.dark{position:absolute;inset:0;background:linear-gradient(transparent 65%,#0007)}
/* Tomás no es una figura CSS: se anima como personaje vectorial SVG completo */
.hero{position:absolute;left:14%;top:70%;width:82px;height:125px;transform:translate(-50%,-70%);z-index:6;transition:width .12s,height .12s;filter:drop-shadow(0 6px 4px #0006);will-change:left,top}
.hero.walk .legL{animation:legL .28s infinite alternate}.hero.walk .legR{animation:legR .28s infinite alternate}.hero.walk .armL{animation:armL .28s infinite alternate}.hero.walk .armR{animation:armR .28s infinite alternate}.hero.walk{animation:bob .28s infinite alternate}
@keyframes bob{to{margin-top:-4px}}@keyframes legL{to{transform:rotate(18deg);transform-origin:42px 80px}}@keyframes legR{to{transform:rotate(-18deg);transform-origin:55px 80px}}@keyframes armL{to{transform:rotate(-15deg);transform-origin:32px 48px}}@keyframes armR{to{transform:rotate(15deg);transform-origin:66px 48px}}
.goal{position:absolute;left:74%;top:43%;width:105px;height:48px;border:7px solid #ffd21f;border-radius:50%;box-shadow:0 0 30px #ffd21f;background:#ffd21f33;transform:translate(-50%,-50%);z-index:4}.lock{position:absolute;right:3%;top:3%;background:#102a40e8;color:#fff;padding:10px 14px;border-radius:14px;font-weight:bold;z-index:8}.tip{position:absolute;left:3%;right:3%;bottom:2%;background:#fffffff2;padding:10px;border-radius:14px;text-align:center;font-weight:bold;z-index:8}
.controls{display:grid;grid-template-columns:65px 65px 65px;grid-template-rows:54px 54px;gap:5px;justify-content:center;margin:8px}.key{border:0;border-radius:14px;background:#fff;color:#075d42;font-size:26px;font-weight:bold;box-shadow:0 3px 8px #0002}.u{grid-column:2}.l{grid-column:1}.d{grid-column:2}.r{grid-column:3}.road{display:flex;gap:5px;overflow:auto;margin:8px 0}.node{flex:1;min-width:125px;background:#fff;border-radius:12px;padding:7px;text-align:center;font-size:12px;font-weight:bold}.node.on{outline:3px solid #ffd21f}.node.done{background:#d9f7df}
.modal{display:none;position:fixed;inset:0;background:#000a;z-index:30;align-items:center;justify-content:center;padding:15px}.card{background:#fff;border-radius:22px;padding:20px;width:min(620px,100%)}.choice{display:block;width:100%;text-align:left;padding:12px;margin:6px 0;border:2px solid #b9d8cd;border-radius:13px;background:#f9fffc;font-size:16px}.good{background:#d9f7df!important;border-color:#249b57!important}.bad{background:#ffe0e0!important;border-color:#d64b4b!important}.next{display:none;width:100%;padding:13px;border:0;border-radius:13px;background:#159447;color:#fff;font-weight:bold;font-size:17px}.foot{text-align:center;font-size:12px;padding:8px}
</style></head><body><div class="app"><div class="top"><div class="brand">🎮 RESPETO QUE NOS UNE</div><div id="lvl" class="level"></div><div class="stats"><span class="stat">⭐ <b id="score">0</b></span><span class="stat">🏅 <b id="medals">0</b></span></div></div><div id="road" class="road"></div>
<div id="stage" class="stage"><img id="scene" class="scene"><div class="dark"></div><div class="goal"></div>
<div id="hero" class="hero">
<svg viewBox="0 0 100 150" width="100%" height="100%" aria-label="Tomás">
<ellipse cx="50" cy="142" rx="26" ry="6" fill="#000" opacity=".25"/>
<g class="legL"><rect x="35" y="88" width="15" height="40" rx="7" fill="#163c73"/><rect x="32" y="121" width="21" height="10" rx="5" fill="#fff"/></g>
<g class="legR"><rect x="52" y="88" width="15" height="40" rx="7" fill="#163c73"/><rect x="50" y="121" width="21" height="10" rx="5" fill="#fff"/></g>
<g class="armL"><rect x="22" y="52" width="14" height="42" rx="7" fill="#f0ae82"/></g><g class="armR"><rect x="65" y="52" width="14" height="42" rx="7" fill="#f0ae82"/></g>
<rect x="31" y="48" width="39" height="52" rx="13" fill="#fff"/><path d="M33 51 Q50 43 68 51 L67 91 Q50 100 33 91Z" fill="#1a5fa8"/>
<rect x="25" y="51" width="49" height="52" rx="13" fill="#154b91"/><rect x="32" y="57" width="35" height="38" rx="8" fill="#1765b3"/><rect x="38" y="64" width="23" height="5" rx="2" fill="#f2a52b"/>
<circle cx="50" cy="32" r="23" fill="#efb084"/><path d="M28 30 Q30 4 51 6 Q76 5 74 33 Q63 20 50 19 Q39 25 28 30Z" fill="#3b261f"/>
</svg></div>
<div id="lock" class="lock">🔒 Pregunta bloqueada</div><div id="tip" class="tip">Mueve a Tomás hasta el círculo amarillo.</div></div>
<div class="controls"><button class="key u" data-d="u">▲</button><button class="key l" data-d="l">◀</button><button class="key d" data-d="d">▼</button><button class="key r" data-d="r">▶</button></div><div class="foot">3ª Comisaría Algarrobo · Emergencias 133 · 35-2535096 · Instagram: 3ra.comisaria_algarrobo</div></div>
<div id="modal" class="modal"><div class="card"><h2 id="qt"></h2><p id="q"></p><div id="answers"></div><p id="fb"></p><button id="next" class="next">CONTINUAR ▶</button></div></div>
<script>
const L=[
["1. COLEGIO · INCLUSIÓN","01_colegio.jpg","¿Qué acción demuestra inclusión en el colegio?",["Dejar a un compañero solo.","Invitar a todos a participar.","Burlarse de las diferencias."],1,"Invitar a participar construye un colegio más inclusivo y respetuoso."],
["2. RECREO · CONVIVENCIA","02_recreo.jpg","Si ves que molestan repetidamente a un compañero, ¿qué haces?",["Lo grabo.","Lo apoyo y aviso a un adulto de confianza sin ponerme en riesgo.","Me río."],1,"Ser testigo activo significa apoyar y buscar ayuda responsable."],
["3. LÍDER · RESPETO","03_lider.jpg","En un lugar público alguien necesita ayuda. ¿Qué haces?",["Ofrezco ayuda respetuosamente.","Me burlo.","Lo grabo para compartirlo."],0,"El buen trato también se practica en la comunidad."],
["4. MUNDO DIGITAL · USO RESPONSABLE","04_digital.jpg","Recibes una imagen humillante de un compañero. ¿Qué haces?",["La reenvío.","No la comparto, conservo evidencia y busco ayuda de un adulto.","Le agrego comentarios."],1,"No compartir contenido humillante ayuda a detener el daño."],
["5. COMISARÍA · RED DE APOYO","05_comisaria.jpg","Si una situación te hace sentir inseguro, ¿qué es importante?",["Guardarla siempre en secreto.","Buscar apoyo de un adulto de confianza y usar los canales adecuados.","Resolverla solo enfrentando a todos."],1,"Pedir ayuda es importante. El 133 es para emergencias o riesgo inmediato."]
];
let lv=0,x=14,y=70,score=0,medals=0,open=false,raf=0,vx=0,vy=0;
const hero=document.getElementById("hero"),modal=document.getElementById("modal");
function road(){let r=document.getElementById("road");r.innerHTML="";L.forEach((z,i)=>{let n=document.createElement("div");n.className="node "+(i==lv?"on ":"")+(i<lv?"done":"");n.textContent=(i<lv?"✓ ":"🔒 ")+z[0];r.appendChild(n)})}
function load(){document.getElementById("scene").src=L[lv][1];document.getElementById("lvl").textContent=L[lv][0];x=14;y=70;open=false;draw();document.getElementById("lock").textContent="🔒 Pregunta bloqueada";document.getElementById("tip").textContent="Mueve a Tomás hasta el círculo amarillo.";road()}
function draw(){hero.style.left=x+"%";hero.style.top=y+"%";let scale=.72+(y/100)*.55;hero.style.width=(82*scale)+"px";hero.style.height=(125*scale)+"px"}
function tick(){if(vx||vy){x=Math.max(5,Math.min(94,x+vx));y=Math.max(22,Math.min(86,y+vy));hero.classList.add("walk");draw();if(!open&&Math.hypot(x-74,y-43)<8){open=true;stop();document.getElementById("lock").textContent="🔓 Pregunta habilitada";document.getElementById("tip").textContent="¡Llegaste al objetivo!";setTimeout(question,250)}}raf=requestAnimationFrame(tick)}
function start(dx,dy){vx=dx;vy=dy;if(!raf)tick()}function stop(){vx=vy=0;hero.classList.remove("walk");cancelAnimationFrame(raf);raf=0}
function question(){let z=L[lv];document.getElementById("qt").textContent=z[0];document.getElementById("q").textContent=z[2];let a=document.getElementById("answers");a.innerHTML="";document.getElementById("fb").textContent="";document.getElementById("next").style.display="none";z[3].forEach((t,i)=>{let b=document.createElement("button");b.className="choice";b.textContent=String.fromCharCode(65+i)+". "+t;b.onclick=()=>answer(i,b);a.appendChild(b)});modal.style.display="flex"}
function answer(i,b){let z=L[lv],bs=[...document.querySelectorAll(".choice")];bs.forEach(q=>q.disabled=true);if(i==z[4]){b.classList.add("good");score+=10;medals++;document.getElementById("fb").innerHTML="⭐ <b>¡Excelente!</b> "+z[5]}else{b.classList.add("bad");bs[z[4]].classList.add("good");document.getElementById("fb").textContent="💡 "+z[5]}document.getElementById("score").textContent=score;document.getElementById("medals").textContent=medals;document.getElementById("next").style.display="block"}
document.getElementById("next").onclick=()=>{modal.style.display="none";lv++;if(lv==L.length){document.body.innerHTML=`<div style="max-width:700px;margin:50px auto;text-align:center;font-family:Arial;padding:25px"><h1>🏆 GUARDIÁN DEL BUEN TRATO</h1><h2>¡Completaste las cinco misiones!</h2><p style="font-size:22px">⭐ ${score} puntos · 🏅 ${medals}/5</p><button onclick="location.reload()" style="padding:14px 25px;border:0;border-radius:14px;background:#159447;color:white;font-size:18px">Jugar nuevamente</button></div>`}else load()}
document.querySelectorAll("[data-d]").forEach(b=>{const v=()=>{let d=b.dataset.d;start(d=="l"?-.28:d=="r"?.28:0,d=="u"?-.28:d=="d"?.28:0)};b.addEventListener("pointerdown",e=>{e.preventDefault();v()});["pointerup","pointerleave","pointercancel"].forEach(e=>b.addEventListener(e,stop))});
document.addEventListener("keydown",e=>{if(modal.style.display=="flex")return;if(e.key=="ArrowLeft")start(-.25,0);if(e.key=="ArrowRight")start(.25,0);if(e.key=="ArrowUp")start(0,-.25);if(e.key=="ArrowDown")start(0,.25)});document.addEventListener("keyup",e=>{if(e.key.startsWith("Arrow"))stop()});
load();
</script></body></html>
