<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Respeto que nos une</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#dff4ff;font-family:Arial,sans-serif;color:#123}.app{max-width:950px;margin:auto;padding:8px}.top{background:#075e43;color:white;border-radius:22px;padding:10px;text-align:center}.top h1{margin:0;font-size:clamp(24px,5vw,40px)}.stats{display:flex;justify-content:center;gap:10px;margin-top:6px}.pill{background:white;color:#123;padding:6px 14px;border-radius:20px;font-weight:bold}.road{display:flex;gap:5px;overflow:auto;margin:8px 0}.node{min-width:120px;flex:1;background:white;padding:7px;border-radius:12px;text-align:center;font-size:12px;font-weight:bold}.on{outline:3px solid #ffd21e}.done{background:#d9f7df}
.stage{position:relative;height:min(68vh,650px);min-height:430px;border:7px solid white;border-radius:25px;overflow:hidden;background:#123;box-shadow:0 5px 15px #0003}.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.goal{position:absolute;left:72%;top:44%;width:100px;height:45px;border:7px solid #ffd21e;border-radius:50%;box-shadow:0 0 28px #ffd21e;transform:translate(-50%,-50%);z-index:4}
#tomas{position:absolute;left:43%;top:76%;width:115px;height:auto;transform:translate(-50%,-75%);z-index:6;filter:drop-shadow(0 7px 4px #0006);will-change:left,top,transform}.walking{animation:bob .22s infinite alternate ease-in-out}@keyframes bob{to{margin-top:-5px}}
.lock{position:absolute;right:3%;top:3%;background:#102a40e8;color:white;padding:9px 13px;border-radius:14px;font-weight:bold;z-index:8}.hint{position:absolute;left:3%;right:3%;bottom:2%;background:#fffffff2;padding:10px;border-radius:14px;text-align:center;font-weight:bold;z-index:8}.controls{display:grid;grid-template-columns:65px 65px 65px;grid-template-rows:54px 54px;gap:5px;justify-content:center;margin:8px}.key{border:0;border-radius:14px;background:white;color:#075e43;font-size:26px;font-weight:bold;box-shadow:0 3px 8px #0002}.u{grid-column:2}.l{grid-column:1}.d{grid-column:2}.r{grid-column:3}
.modal{display:none;position:fixed;inset:0;background:#000a;z-index:20;align-items:center;justify-content:center;padding:15px}.card{background:white;border-radius:22px;padding:20px;width:min(620px,100%)}.choice{width:100%;text-align:left;padding:12px;margin:6px 0;border:2px solid #bad9cf;border-radius:13px;background:#f8fffb;font-size:16px}.good{background:#d9f7df!important;border-color:#249b57!important}.bad{background:#ffe0e0!important;border-color:#d64b4b!important}.next{display:none;width:100%;padding:13px;border:0;border-radius:13px;background:#159447;color:white;font-weight:bold;font-size:17px}.foot{text-align:center;padding:8px;font-size:12px}
</style></head><body><div class="app"><div class="top"><h1>🎮 RESPETO QUE NOS UNE</h1><div>Tomás y las misiones del buen trato</div><div class="stats"><span class="pill">⭐ <b id="score">0</b></span><span class="pill">🏅 <b id="medals">0</b>/5</span></div></div><div id="road" class="road"></div>
<div id="stage" class="stage"><img id="bg" class="bg"><div class="goal"></div><img id="tomas" src="tomas.png"><div id="lock" class="lock">🔒 Pregunta bloqueada</div><div id="hint" class="hint">Mueve a Tomás hasta el círculo amarillo.</div></div>
<div class="controls"><button class="key u" data-d="u">▲</button><button class="key l" data-d="l">◀</button><button class="key d" data-d="d">▼</button><button class="key r" data-d="r">▶</button></div><div class="foot">3ª Comisaría Algarrobo · Emergencias 133 · 35-2535096 · Instagram: 3ra.comisaria_algarrobo</div></div>
<div id="modal" class="modal"><div class="card"><h2 id="qt"></h2><p id="q"></p><div id="ans"></div><p id="fb"></p><button id="next" class="next">CONTINUAR ▶</button></div></div>
<script>
const L=[
["1. COLEGIO · INCLUSIÓN","01_colegio.jpg","¿Qué acción demuestra inclusión en el colegio?",["Dejar a un compañero solo.","Invitar a todos a participar.","Burlarse de las diferencias."],1,"Invitar a participar construye un colegio más inclusivo y respetuoso."],
["2. RECREO · CONVIVENCIA","02_recreo.png","Si ves que molestan repetidamente a un compañero, ¿qué haces?",["Lo grabo.","Lo apoyo y aviso a un adulto de confianza sin ponerme en riesgo.","Me río."],1,"Un testigo activo apoya y busca ayuda responsable."],
["3. LÍDER · RESPETO","03_lider.png","En un lugar público alguien necesita ayuda. ¿Qué haces?",["Ofrezco ayuda respetuosamente.","Me burlo.","Lo grabo para compartirlo."],0,"El buen trato también se practica en la comunidad."],
["4. MUNDO DIGITAL · USO RESPONSABLE","04_digital.png","Recibes una imagen humillante de un compañero. ¿Qué haces?",["La reenvío.","No la comparto, conservo evidencia y busco ayuda de un adulto.","Le agrego comentarios."],1,"No compartir contenido humillante ayuda a detener el daño."],
["5. COMISARÍA · RED DE APOYO","05_comisaria.png","Si una situación te hace sentir inseguro, ¿qué es importante?",["Guardarla siempre en secreto.","Buscar apoyo de un adulto de confianza y usar los canales adecuados.","Resolverla solo."],1,"Pedir ayuda es importante. El 133 se utiliza para emergencias o riesgo inmediato."]
];
let lv=0,x=43,y=76,score=0,medals=0,opened=false,vx=0,vy=0,raf=0;
const tomas=document.getElementById("tomas"),modal=document.getElementById("modal");
function road(){let r=document.getElementById("road");r.innerHTML="";L.forEach((z,i)=>{let e=document.createElement("div");e.className="node "+(i==lv?"on ":"")+(i<lv?"done":"");e.textContent=(i<lv?"✓ ":"🔒 ")+z[0];r.appendChild(e)})}
function load(){document.getElementById("bg").src=L[lv][1];x=43;y=76;opened=false;draw();document.getElementById("lock").textContent="🔒 Pregunta bloqueada";document.getElementById("hint").textContent="Mueve a Tomás hasta el círculo amarillo.";road()}
function draw(){let s=.72+(y/100)*.5;tomas.style.left=x+"%";tomas.style.top=y+"%";tomas.style.width=(115*s)+"px"}
function tick(){if(vx||vy){x=Math.max(7,Math.min(92,x+vx));y=Math.max(28,Math.min(85,y+vy));tomas.classList.add("walking");draw();if(!opened&&Math.hypot(x-72,y-44)<8){opened=true;stop();document.getElementById("lock").textContent="🔓 Pregunta habilitada";document.getElementById("hint").textContent="¡Llegaste!";setTimeout(question,250)}}raf=requestAnimationFrame(tick)}
function start(dx,dy){vx=dx;vy=dy;if(dx<0)tomas.style.transform="translate(-50%,-75%) scaleX(-1)";else if(dx>0)tomas.style.transform="translate(-50%,-75%) scaleX(1)";if(!raf)tick()}
function stop(){vx=vy=0;tomas.classList.remove("walking");cancelAnimationFrame(raf);raf=0}
function question(){let z=L[lv];document.getElementById("qt").textContent=z[0];document.getElementById("q").textContent=z[2];let a=document.getElementById("ans");a.innerHTML="";document.getElementById("fb").textContent="";document.getElementById("next").style.display="none";z[3].forEach((t,i)=>{let b=document.createElement("button");b.className="choice";b.textContent=String.fromCharCode(65+i)+". "+t;b.onclick=()=>answer(i,b);a.appendChild(b)});modal.style.display="flex"}
function answer(i,b){let z=L[lv],bs=[...document.querySelectorAll(".choice")];bs.forEach(q=>q.disabled=true);if(i==z[4]){b.classList.add("good");score+=10;medals++;document.getElementById("fb").innerHTML="⭐ <b>¡Excelente!</b> "+z[5]}else{b.classList.add("bad");bs[z[4]].classList.add("good");document.getElementById("fb").textContent="💡 "+z[5]}document.getElementById("score").textContent=score;document.getElementById("medals").textContent=medals;document.getElementById("next").style.display="block"}
document.getElementById("next").onclick=()=>{modal.style.display="none";lv++;if(lv>=L.length){document.body.innerHTML=`<div style="max-width:700px;margin:50px auto;text-align:center;font-family:Arial;padding:25px"><h1>🏆 GUARDIÁN DEL BUEN TRATO</h1><h2>¡Completaste las cinco misiones!</h2><p>⭐ ${score} puntos · 🏅 ${medals}/5</p><button onclick="location.reload()" style="padding:14px 25px;border:0;border-radius:14px;background:#159447;color:white;font-size:18px">Jugar nuevamente</button></div>`}else load()}
document.querySelectorAll("[data-d]").forEach(b=>{const go=()=>{let d=b.dataset.d;start(d=="l"?-.22:d=="r"?.22:0,d=="u"?-.22:d=="d"?.22:0)};b.addEventListener("pointerdown",e=>{e.preventDefault();go()});["pointerup","pointerleave","pointercancel"].forEach(ev=>b.addEventListener(ev,stop))});
document.addEventListener("keydown",e=>{if(e.key=="ArrowLeft")start(-.2,0);if(e.key=="ArrowRight")start(.2,0);if(e.key=="ArrowUp")start(0,-.2);if(e.key=="ArrowDown")start(0,.2)});document.addEventListener("keyup",e=>{if(e.key.startsWith("Arrow"))stop()});load();
</script></body></html>
