<!doctype html><html lang='es'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Desafío del Buen Trato - 3ª Comisaría Algarrobo</title><style>
:root{--g:#064d2d;--b:#0878c9;--y:#ffd84d;--r:#e63b34;--bg:#eef8f2}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:var(--bg);color:#183026}.wrap{max-width:760px;margin:auto;padding:16px}.hero{background:linear-gradient(135deg,#075b35,#0878c9);color:white;padding:22px;border-radius:24px;text-align:center;box-shadow:0 8px 24px #0002}.hero h1{font-size:clamp(30px,8vw,54px);margin:0;line-height:.95}.hero p{font-size:18px}.badge{display:inline-block;background:var(--y);color:#222;padding:7px 12px;border-radius:999px;font-weight:800}.card{background:white;border-radius:22px;padding:20px;margin-top:16px;box-shadow:0 6px 18px #0001}.card h2{margin-top:0;color:var(--g)}button{width:100%;padding:14px 16px;margin:7px 0;border:2px solid #d9e7de;border-radius:15px;background:white;font-size:17px;text-align:left;font-weight:650}button:hover{border-color:var(--b)}button.good{background:#dff6e7;border-color:#32a85c}button.bad{background:#ffe2df;border-color:#e45b50}.next{background:var(--g);color:white;text-align:center;border:none}.progress{height:12px;background:#dbe9df;border-radius:10px;overflow:hidden;margin:14px 0}.bar{height:100%;background:var(--y);width:0}.feedback{font-weight:750;padding:10px;border-radius:12px;margin-top:8px;display:none}.score{font-size:18px;font-weight:800}.hidden{display:none}.footer{text-align:center;padding:24px 10px;color:#315b47;font-size:14px}.stars{font-size:36px}.contact{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.contact span{background:#063f27;color:white;padding:8px 10px;border-radius:10px}textarea{width:100%;min-height:90px;border:2px solid #cfe0d5;border-radius:14px;padding:12px;font-size:16px}.icon{font-size:54px;text-align:center}.sponsor{font-weight:800;color:#165fa9}</style></head><body><div class='wrap'>
<section class='hero'><span class='badge'>3ª COMISARÍA ALGARROBO</span><h1>DESAFÍO DEL<br>BUEN TRATO</h1><p>Ayuda a Tomás a detener el bullying. ¡Cada buena decisión suma!</p><div class='stars'>🤝 ❤️ 🛡️</div></section>
<div class='progress'><div class='bar' id='bar'></div></div><div class='score' id='score'>Puntaje: 0 / 6</div>
<div id='game'></div>
<div class='footer'><div class='contact'><span>Emergencias 133</span><span>3ª Comisaría: 35-2535096</span></div><p>Instagram: <b>@3ra.comisaria_algarrobo</b></p><p>Con el apoyo de <span class='sponsor'>Líder Walmart</span> y DAEM Algarrobo.</p></div>
</div><script>
const missions=[
{title:'Misión 1 · ¿Es bullying?',icon:'🎒',story:'En el recreo, varios compañeros esconden todos los días la mochila de Tomás y se ríen cuando él se angustia.',q:'¿Qué está ocurriendo?',opts:['Es solo una broma y no importa','Es una conducta de bullying que debe detenerse','Tomás debería esconder otra mochila'],ok:1,yes:'¡Correcto! Cuando el maltrato se repite y causa daño, debemos pedir ayuda.',no:'Piensa en cómo se siente Tomás. Repetir una conducta que causa daño no es una simple broma.'},
{title:'Misión 2 · Semáforo del buen trato',icon:'🚦',story:'Sofía ve a Tomás solo mientras otros niños no lo dejan jugar.',q:'¿Cuál es una acción de buen trato?',opts:['Invitarlo a participar','Reírse con los demás','Ignorarlo para no meterse'],ok:0,yes:'¡Verde! Incluir y acompañar hace la diferencia.',no:'El buen trato significa incluir, respetar y apoyar a quien lo necesita.'},
{title:'Misión 3 · En Líder',icon:'🛒',story:'En el supermercado, unos compañeros vuelven a molestar a Tomás. Sofía presencia la situación.',q:'¿Qué debería hacer Sofía?',opts:['Grabarlo para subirlo a redes','Acompañar a Tomás y avisar a un adulto responsable','Irse y no decir nada'],ok:1,yes:'¡Muy bien! Un buen testigo no aumenta el daño: acompaña y busca ayuda.',no:'Grabar, reírse o ignorar puede aumentar el daño. Lo adecuado es apoyar y buscar ayuda.'},
{title:'Misión 4 · Ciberbullying',icon:'📱',story:'En un grupo publican una imagen editada de Tomás para burlarse de él.',q:'¿Cuál es la mejor decisión?',opts:['Compartirla porque ya está publicada','Responder con insultos','No compartirla, guardar evidencia y avisar a un adulto'],ok:2,yes:'¡Excelente! En internet también debemos respetar y pedir ayuda.',no:'No difundas el contenido ni respondas con más agresión. Guarda evidencia y habla con un adulto de confianza.'},
{title:'Misión 5 · Equipo Carabineros',icon:'🐕 🐎 🚁',story:'Perros policiales, caballos, helicópteros y Carabineros cumplen distintas funciones al servicio de la comunidad.',q:'¿Qué valor comparten estas labores?',opts:['Trabajo en equipo y servicio a la comunidad','Competir para ver quién es mejor','Dejar fuera a quienes son diferentes'],ok:0,yes:'¡Correcto! Trabajar en equipo, respetar y cuidar fortalece a toda la comunidad.',no:'La misión común es servir y cuidar trabajando en equipo.'},
{title:'Misión 6 · Tu decisión',icon:'❤️',story:'Ves a un compañero triste porque otros lo molestan repetidamente.',q:'¿Qué puedes hacer?',opts:['Escucharlo, acompañarlo y buscar ayuda de un adulto','Decirle que aguante solo','Publicar lo ocurrido sin permiso'],ok:0,yes:'¡Misión cumplida! Escuchar, acompañar y pedir ayuda son acciones valientes.',no:'La persona afectada necesita apoyo, no más exposición ni quedarse sola.'}
];
let i=0,score=0,answered=false;const game=document.getElementById('game'),bar=document.getElementById('bar'),scoreEl=document.getElementById('score');
function render(){answered=false;bar.style.width=(i/missions.length*100)+'%';if(i>=missions.length){finish();return}const m=missions[i];game.innerHTML=`<section class='card'><div class='icon'>${m.icon}</div><h2>${m.title}</h2><p>${m.story}</p><h3>${m.q}</h3><div id='opts'>${m.opts.map((x,n)=>`<button onclick='answer(${n},this)'>${String.fromCharCode(65+n)}) ${x}</button>`).join('')}</div><div id='fb' class='feedback'></div><button id='next' class='next hidden' onclick='advance()'>Continuar →</button></section>`}
window.answer=(n,btn)=>{if(answered)return;answered=true;const m=missions[i],fb=document.getElementById('fb');document.querySelectorAll('#opts button').forEach((b,k)=>{if(k===m.ok)b.classList.add('good');else if(k===n)b.classList.add('bad')});if(n===m.ok){score++;fb.textContent=m.yes;fb.style.background='#dff6e7'}else{fb.textContent=m.no;fb.style.background='#fff1c9'}fb.style.display='block';scoreEl.textContent=`Puntaje: ${score} / 6`;document.getElementById('next').classList.remove('hidden')};
window.advance=()=>{i++;render()};
function finish(){bar.style.width='100%';let msg=score>=5?'¡Excelente trabajo!':score>=3?'¡Muy bien! Sigue practicando el buen trato.':'Cada intento enseña. Puedes volver a jugar y mejorar.';game.innerHTML=`<section class='card' style='text-align:center'><div class='icon'>🏅</div><h2>¡MISIÓN CUMPLIDA!</h2><p><b>${msg}</b></p><p>Completaste el <b>Desafío del Buen Trato</b>.</p><div class='stars'>${'⭐'.repeat(Math.max(1,Math.min(6,score)))}</div><h3>${score} de 6 respuestas correctas</h3><p>Ahora tú también eres parte del equipo contra el bullying.</p><textarea placeholder='Escribe aquí tu compromiso de buen trato...'></textarea><button class='next' onclick='restart()'>Jugar nuevamente</button></section>`}
window.restart=()=>{i=0;score=0;scoreEl.textContent='Puntaje: 0 / 6';render()};render();
</script></body></html>
